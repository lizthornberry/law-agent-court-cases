[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    # app.py still uses @app.on_event("startup"), which FastAPI now deprecates in
    # favour of lifespan handlers. Matched on message, not module: the warning is
    # attributed to a different frame depending on which filters are active.
    # Silenced narrowly so any other DeprecationWarning stays visible.
    ignore:(?s).*on_event is deprecated:DeprecationWarning
